name: Package DynamicDesktop v0.1.13
on:
  push:
    branches: ['release-build/v0.1.13']
    paths: ['nsis-3.13.zip', '.github/workflows/package-v0.1.13.yml']

permissions:
  contents: write

jobs:
  package:
    if: "!contains(github.event.head_commit.modified, '.github/workflows/package-v0.1.13.yml')"
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 2cc8c206f6bb1fbfcb8d3f2ab20af33135a24250
          persist-credentials: false
      - name: Check out the verified NSIS archive from the build branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: ci-dependencies
          persist-credentials: false
          sparse-checkout: nsis-3.13.zip
          sparse-checkout-cone-mode: false
      - name: Prepare pinned build dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force host/lib, dist/installer-tools | Out-Null
          Invoke-WebRequest 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4191.47/microsoft.web.webview2.1.0.4191.47.nupkg' -OutFile 'host/lib/Microsoft.Web.WebView2.1.0.4191.47.nupkg'
          $nsisZip = 'ci-dependencies/nsis-3.13.zip'
          if ((Get-FileHash $nsisZip).Hash -ne 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8') { throw 'Invalid NSIS archive checksum' }
          Expand-Archive $nsisZip -DestinationPath 'dist/installer-tools'
      - name: Build and verify installer and source
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tools\build-installer.ps1 -NsisCompiler 'dist/installer-tools/nsis-3.13/makensis.exe'
          $hostVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path 'host/bin/DynamicDesktop.exe').Path).FileVersion
          if ($hostVersion -ne '0.1.13.0') { throw "Unexpected host version $hostVersion" }
          foreach ($asset in 'DynamicDesktop-0.1.13-win-x64-Setup.exe', 'DynamicDesktop-source.zip') {
            $path = Join-Path dist $asset
            $hash = (Get-FileHash $path).Hash
            if ((Get-Content -Raw "$path.sha256").Trim() -ne "$hash  $asset") { throw "Checksum mismatch for $asset" }
            Write-Host "$asset SHA-256 $hash"
          }
      - name: Attach verified files to release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          ## Display changes and WebView2 recovery

          - DynamicDesktop waits for the display layout to settle before remounting the wallpaper when you dock, undock, or change monitors.
          - Wallpaper and Settings initialize WebView2 one at a time. If the wallpaper controller is busy or times out, DynamicDesktop cleans up and retries up to twice.

          Use **Check for updates** in DynamicDesktop or download the Windows x64 installer below.
          '@ | Set-Content -Encoding utf8 'dist/release-notes.md'
          gh release create v0.1.13 --repo 'Timminater/DynamicDesktop' --target '2cc8c206f6bb1fbfcb8d3f2ab20af33135a24250' --draft --title 'DynamicDesktop v0.1.13' --notes-file 'dist/release-notes.md' 'dist/DynamicDesktop-0.1.13-win-x64-Setup.exe' 'dist/DynamicDesktop-0.1.13-win-x64-Setup.exe.sha256' 'dist/DynamicDesktop-source.zip' 'dist/DynamicDesktop-source.zip.sha256'
          if ($LASTEXITCODE -ne 0) { throw 'Release draft or asset upload failed' }

  publish:
    if: contains(github.event.head_commit.modified, '.github/workflows/package-v0.1.13.yml')
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Publish the validated DynamicDesktop v0.1.13 draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $repo = 'Timminater/DynamicDesktop'
          $target = '2cc8c206f6bb1fbfcb8d3f2ab20af33135a24250'
          $main = gh api "repos/$repo/commits/main" --jq '.sha'
          if ($main -ne $target) { throw 'Unexpected main commit' }
          $draft = gh api "repos/$repo/releases/455289995" | ConvertFrom-Json
          if (-not $draft.draft -or $draft.prerelease -or $draft.tag_name -ne 'v0.1.13' -or $draft.target_commitish -ne $target) {
            throw 'Unexpected release draft'
          }
          $expected = @{
            'DynamicDesktop-0.1.13-win-x64-Setup.exe' = 'a62781021ff3f959ca4a672f7a170505f52ca9bc210e2a30d7f413559c71a0e0'
            'DynamicDesktop-0.1.13-win-x64-Setup.exe.sha256' = '672f7b416edca4e7d3658682045f011fc328a9e787efd2c2427bd3ca830583e2'
            'DynamicDesktop-source.zip' = '37c0f8d09795e142e313fe836e0690d810e2c29aa50918fe97675bd6910fc5f5'
            'DynamicDesktop-source.zip.sha256' = '166f084fa422dd0c0e3e5de51f08315824b2521be64e415fe478f7887de1db5b'
          }
          if ($draft.assets.Count -ne $expected.Count) { throw 'Unexpected release asset count' }
          foreach ($asset in $draft.assets) {
            if (-not $expected.ContainsKey($asset.name) -or $asset.digest -ne "sha256:$($expected[$asset.name])" -or $asset.state -ne 'uploaded') {
              throw "Unexpected release asset $($asset.name)"
            }
          }
          gh release edit v0.1.13 --repo $repo --draft=false --latest
