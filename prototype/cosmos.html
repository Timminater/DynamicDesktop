<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DynamicDesktop · Cosmos</title>
<!--
  cosmos theme (Canvas 2D)
  Art direction: deep space. Every group of icons is a star system: the icons are its suns, sitting in a dark pocket with a glowing rim of gas
  - Orbits: contour lines of the icon field at growing distances, so they follow the shape of each group and merge between neighbouring groups
    like equipotential lines. Planets travel along them, always lit from the side that faces their suns (the direction in which the field falls)
  - Nebula: noise colored by the palette, brighter around the groups; computed at low resolution (it is soft anyway) and enlarged smoothly
  - Background, nebula, stars and orbit lines are static and cached at the screen's actual pixels (old and new scene cross-fade when the icons move)
  - Every frame only draws small things: a slowly turning spiral galaxy (one sprite), twinkling stars, planets with trails, moons and rings,
    shooting stars, now and then a comet and a nova
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04030f; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* Preview mode (?preview=1, inside the settings window) and standalone mode: translucent blocks mark where the icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.ghosts #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(0,0,0,.4); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="ghosts"></div>

<script>

    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical pixels → CSS pixels
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    clearTimeout(rebuildT);
    commit(first);                                // first time: the sky fades in; afterwards: old and new scene cross-fade
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
// Opened directly in a browser: a sample desktop (for work on the theme); R = new sky
function startStandalone() {
  document.body.classList.add('ghosts');
  const cell = (c, r) => ({ x: GRID_X0 + c * CELL_W, y: GRID_Y0 + r * CELL_H, w: CELL_W, h: 92 });
  icons = [];
  for (let c = 0; c < 3; c++) for (let r = 0; r < Math.min(8, Math.floor((H - TASKBAR) / CELL_H)); r++) icons.push(cell(c, r));
  for (const [c, r] of [[7, 1], [8, 1], [8, 2], [13, 4], [14, 4], [19, 0], [19, 1]]) if (GRID_X0 + (c + 1) * CELL_W < W) icons.push(cell(c, r));
  drawGhosts();
  iconsSeen = true;
  commit(true);
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reseed((Math.random() * 1e6) | 0); });
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); if (iconsSeen) { commit(false); morphT0 = -1e9; } }, 100);
});

resize();
if (WALL || PREVIEW) startHostedMode(); else startStandalone();
requestAnimationFrame(frame);
</script>
