<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DynamicDesktop · Floating Isles</title>
<!--
  floating isles theme (fantasy; top view; Canvas 2D)
  Art direction: islands of moss and rock float above a sea of clouds at dusk; the icons rest on the islands
  - Islands: the same icon field as the other themes (a sum of Gaussians around the icons, warped by noise); the coast is traced with marching squares
    and drawn as vector paths. Deeper contours of the same field, pushed down, make the rocky underside taper like an upside-down cone
  - Static drawing (sky, islands, trees, towers, crystal bodies) is cached at the screen's actual pixels; when the icons move the old and new islands cross-fade
  - Every frame only draws small things: drifting cloud puffs below the islands, crystal glows, magic motes and, now and then, a dragon gliding across
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1540; }
  #art { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  /* Preview mode (?preview=1, inside the settings window) and standalone mode: translucent blocks mark where the icons are */
  #ghosts { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.ghosts #ghosts { display: block; }
  .ghost { position: absolute; }
  .ghost i { position: absolute; left: 50%; top: 4px; width: 48px; height: 48px; margin-left: -24px; border-radius: 9px;
    background: rgba(255,255,255,.88); box-shadow: 3px 6px 8px rgba(20,10,50,.35); }
  .ghost b { position: absolute; left: 14%; right: 14%; top: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.75); }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div id="ghosts"></div>
<!-- Community theme (GPL-3.0). See NOTICE for attribution. -->
<script>
'use strict';

/* ======================================================================
   Parameters
   ====================================================================== */
const CELL_W = 76, CELL_H = 100, GRID_X0 = 4, GRID_Y0 = 6, TASKBAR = 48;   // desktop grid (also used by share.js)
const STEP = 6;                                  // field grid (CSS px)
const MORPH_MS = 1600;

const QS = new URLSearchParams(location.search);
const WALL = QS.has('wallpaper');                // wallpaper mode: loaded by the desktop host; messages come from the host
const PREVIEW = QS.has('preview');               // preview mode: the preview (iframe) in the settings window; messages come from the parent page
// Defaults must match the "default" values of the isles theme in themes.json
const P = { sigma: 70, warp: 40, islets: 5, trees: 0.5, sky: 0, crystals: 5, motes: 30, flow: 1, dragon: 1, adaptive: 1, cap30: true };
const DEFAULTS = Object.assign({}, P);
// Accepted parameters: [min, max, integer]
const RANGES = { sigma: [40, 200], warp: [0, 80], islets: [0, 12, 1], trees: [0, 1], sky: [0, 3, 1], crystals: [0, 12, 1],
  motes: [0, 80, 1], flow: [0, 3], dragon: [0, 1, 1], adaptive: [0, 1, 1] };
// Sky colors: dusk, dawn, day, night. deep / mid / glow: the gradient far below; puff: shade, body and lit side of the clouds;
// stars and nebula: how much of them shows; shadow: the islands' shadow on the clouds; light: tint on the lit and the shaded side of the grass
const SKIES = [
  { deep: '#120c2a', mid: '#2a1f5c', glow: '#7a4b9a', puff: ['rgba(70,52,130,0.55)', 'rgba(150,128,206,0.6)', 'rgba(244,196,222,0.42)'],
    stars: 1, nebula: 0.22, shadow: 'rgba(8,3,30,0.6)', light: ['rgba(255,205,170,0.16)', 'rgba(40,20,90,0.2)'] },
  { deep: '#3a2147', mid: '#a5527a', glow: '#ffb37a', puff: ['rgba(150,80,110,0.5)', 'rgba(255,172,150,0.62)', 'rgba(255,236,200,0.5)'],
    stars: 0.25, nebula: 0.1, shadow: 'rgba(60,20,50,0.5)', light: ['rgba(255,220,160,0.2)', 'rgba(120,40,90,0.16)'] },
  { deep: '#2f6fb8', mid: '#58a6e0', glow: '#bfe6ff', puff: ['rgba(120,150,190,0.5)', 'rgba(235,243,252,0.78)', 'rgba(255,255,255,0.6)'],
    stars: 0, nebula: 0, shadow: 'rgba(20,50,100,0.4)', light: ['rgba(255,255,230,0.14)', 'rgba(30,60,110,0.12)'] },
  { deep: '#03050f', mid: '#0c1433', glow: '#1d2f66', puff: ['rgba(10,16,40,0.6)', 'rgba(52,66,120,0.55)', 'rgba(140,160,220,0.3)'],
    stars: 2.2, nebula: 0.1, shadow: 'rgba(0,0,10,0.6)', light: ['rgba(150,170,255,0.1)', 'rgba(0,0,30,0.36)'] },
];
const GEOMETRY_KEYS = ['sigma', 'warp', 'islets', 'trees', 'crystals', 'adaptive'];

/* ======================================================================
   Random numbers and noise (seeded: desktop and preview show the same scene)
   ====================================================================== */
let seed = (Math.random() * 1e6) | 0;
function hash2(x, y, k = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed + k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, k), b = hash2(ix + 1, iy, k), c = hash2(ix, iy + 1, k), d = hash2(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, k = 0) {
  let a = 0.5, s = 0;
  for (let i = 0; i < 4; i++) { s += a * vnoise(x, y, k + i * 7); x = x * 2.03 + 17.1; y = y * 2.03 + 17.1; a *= 0.5; }
  return s;
}
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const ss = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t, alpha = 1) => `rgba(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')},${alpha})`;

/* ======================================================================
   Island field (CPU): s = signed distance to the coast (<0 is land), as in the other themes
   ====================================================================== */
let W = innerWidth, H = innerHeight, Gw = 1, Gh = 1, NZ = null;
function buildNoise() {
  const N = Gw * Gh;
  NZ = { wx: new Float32Array(N), wy: new Float32Array(N) };
  for (let gy = 0; gy < Gh; gy++) for (let gx = 0; gx < Gw; gx++) {
    const i = gy * Gw + gx, x = gx * STEP, y = gy * STEP;
    NZ.wx[i] = fbm(x * 0.0028, y * 0.0028, 1) - 0.47;
    NZ.wy[i] = fbm(x * 0.0028, y * 0.0028, 2) - 0.47;
  }
  toneCanvas = null;
}
// rects: { cx, cy, hw, hh, w } (w: weight; below 1 → a smaller island)
function computeField(rects) {
  const N = Gw * Gh, f1 = new Float32Array(N);
  const sig = P.sigma, is1 = 1 / (sig * sig), wa = P.warp * 2.2, wmax = wa * 0.5;
  for (const r of rects) {
    const R = 5.5 * sig + Math.max(r.hw, r.hh) * 0.5 + wmax;
    const gx0 = Math.max(0, Math.floor((r.cx - R) / STEP)), gx1 = Math.min(Gw - 1, Math.ceil((r.cx + R) / STEP));
    const gy0 = Math.max(0, Math.floor((r.cy - R) / STEP)), gy1 = Math.min(Gh - 1, Math.ceil((r.cy + R) / STEP));
    const chw = r.hw * 0.5, chh = r.hh * 0.5, w = r.w || 1;
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const i = gy * Gw + gx;
      const qx = gx * STEP + NZ.wx[i] * wa, qy = gy * STEP + NZ.wy[i] * wa;
      let dx = Math.abs(qx - r.cx) - chw, dy = Math.abs(qy - r.cy) - chh;
      if (dx < 0) dx = 0; if (dy < 0) dy = 0;
      f1[i] += w * Math.exp(-(dx * dx + dy * dy) * is1);
    }
  }
  const c0 = Math.sqrt(-Math.log(0.35)), s = new Float32Array(N), fMin = Math.exp(-30);
  for (let i = 0; i < N; i++) {
    const g = Math.log(Math.max(f1[i], fMin));
    s[i] = sig * (Math.sqrt(Math.max(-g, 0)) - c0) - sig * 0.6 * Math.max(g, 0);
  }
  return s;
}
function sampleArr(a, x, y) {
  const fx = Math.min(Math.max(x / STEP, 0), Gw - 1.001), fy = Math.min(Math.max(y / STEP, 0), Gh - 1.001);
  const ix = Math.floor(fx), iy = Math.floor(fy), tx = fx - ix, ty = fy - iy, i = iy * Gw + ix;
  return (a[i] * (1 - tx) + a[i + 1] * tx) * (1 - ty) + (a[i + Gw] * (1 - tx) + a[i + Gw + 1] * tx) * ty;
}

// Marching squares at level lv; the grid is padded with "sea" so every coast is a closed loop. Returns loops of [x0, y0, x1, y1, …] (CSS px)
function contours(s, lv) {
  const gw = Gw + 2, gh = Gh + 2, V = new Float32Array(gw * gh);
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++)
    V[j * gw + i] = i < 1 || j < 1 || i > Gw || j > Gh ? 1e3 : s[(j - 1) * Gw + i - 1] - lv;
  const pos = new Map(), adj = new Map();
  const link = (a, b) => { (adj.get(a) || adj.set(a, []).get(a)).push(b); (adj.get(b) || adj.set(b, []).get(b)).push(a); };
  const hk = (i, j) => {                          // point on the edge (i, j)–(i+1, j)
    const k = (j * gw + i) * 2;
    if (!pos.has(k)) { const a = V[j * gw + i], b = V[j * gw + i + 1]; pos.set(k, [(i - 1 + a / (a - b)) * STEP, (j - 1) * STEP]); }
    return k;
  };
  const vk = (i, j) => {                          // point on the edge (i, j)–(i, j+1)
    const k = (j * gw + i) * 2 + 1;
    if (!pos.has(k)) { const a = V[j * gw + i], b = V[(j + 1) * gw + i]; pos.set(k, [(i - 1) * STEP, (j - 1 + a / (a - b)) * STEP]); }
    return k;
  };
  for (let j = 0; j < gh - 1; j++) for (let i = 0; i < gw - 1; i++) {
    const a = V[j * gw + i], b = V[j * gw + i + 1], c = V[(j + 1) * gw + i + 1], d = V[(j + 1) * gw + i];
    const code = (a < 0 ? 8 : 0) | (b < 0 ? 4 : 0) | (c < 0 ? 2 : 0) | (d < 0 ? 1 : 0);
    if (code === 0 || code === 15) continue;
    const E = [() => hk(i, j), () => vk(i + 1, j), () => hk(i, j + 1), () => vk(i, j)];   // top, right, bottom, left
    const seg = (p, q) => link(E[p](), E[q]());
    const mid = (a + b + c + d) / 4 < 0;
    switch (code) {
      case 1: case 14: seg(3, 2); break;
      case 2: case 13: seg(2, 1); break;
      case 3: case 12: seg(3, 1); break;
      case 4: case 11: seg(0, 1); break;
      case 6: case 9: seg(0, 2); break;
      case 7: case 8: seg(3, 0); break;
      case 5: if (mid) { seg(0, 3); seg(1, 2); } else { seg(0, 1); seg(3, 2); } break;
      case 10: if (mid) { seg(0, 1); seg(2, 3); } else { seg(0, 3); seg(1, 2); } break;
    }
  }
  const loops = [], used = new Set();
  for (const start of adj.keys()) {
    if (used.has(start)) continue;
    const pts = [];
    let prev = -1, cur = start;
    while (cur !== undefined && !used.has(cur)) {
      used.add(cur);
      const p = pos.get(cur); pts.push(p[0], p[1]);
      const nb = adj.get(cur), next = nb[0] !== prev ? nb[0] : nb[1];
      prev = cur; cur = next;
    }
    let area = 0;
    for (let k = 0, n = pts.length; k < n; k += 2) area += pts[k] * pts[(k + 3) % n] - pts[(k + 2) % n] * pts[k + 1];
    if (pts.length >= 8 && Math.abs(area) > 80) loops.push(pts);
  }
  return loops;
}
// Smooth closed path through the loops (quadratic curves through the midpoints); filled with the even-odd rule so lakes stay open
function loopsPath(loops) {
  const path = new Path2D();
  for (const L of loops) {
    const n = L.length / 2;
    path.moveTo((L[2 * n - 2] + L[0]) / 2, (L[2 * n - 1] + L[1]) / 2);
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      path.quadraticCurveTo(L[2 * i], L[2 * i + 1], (L[2 * i] + L[2 * j]) / 2, (L[2 * i + 1] + L[2 * j + 1]) / 2);
    }
    path.closePath();
  }
  return path;
}

/* ======================================================================
   Scene geometry (CSS px; independent of the canvas resolution): islands, trees, towers, crystals
   Positions come from fixed per-cell random numbers, so things stay put when only some icons move
   ====================================================================== */
let icons = [];
const iconRects = () => icons.map(ic => ({ cx: ic.x + ic.w / 2, cy: ic.y + ic.h / 2, hw: ic.w / 2 - 4, hh: ic.h / 2 - 2 }));
function nearIcon(x, y, m) {
  for (const ic of icons) if (x > ic.x - m && x < ic.x + ic.w + m && y > ic.y - m && y < ic.y + ic.h + m) return true;
  return false;
}
function fieldRects() {
  const rnd = mulberry32(seed * 7 + 3), out = [];
  const own = P.adaptive ? iconRects() : [];
  if (!P.adaptive) {                               // not adapting: a few large islands of their own
    for (let i = 0; i < 4; i++) out.push({ cx: W * (0.12 + 0.76 * rnd()), cy: (H - TASKBAR) * (0.15 + 0.7 * rnd()), hw: 60 + 120 * rnd(), hh: 50 + 90 * rnd(), w: 1 });
  }
  const isl = [];
  for (let t = 0; t < 90 && isl.length < P.islets; t++) {
    const x = 40 + (W - 80) * rnd(), y = 40 + (H - TASKBAR - 80) * rnd(), r = rnd();
    if (own.concat(out).some(o => Math.hypot(o.cx - x, o.cy - y) < P.sigma * 2.4 + Math.max(o.hw, o.hh) + 40)) continue;
    if (isl.some(o => Math.hypot(o.cx - x, o.cy - y) < P.sigma * 2.2)) continue;
    isl.push({ cx: x, cy: y, hw: 6 + 26 * r, hh: 6 + 20 * rnd(), w: 0.55 + 0.25 * r });
  }
  return own.concat(out, isl);
}
function buildGeometry() {
  const s = computeField(fieldRects());
  const geo = { s, levels: [0, -10, -20, -32].map(lv => loopsPath(contours(s, lv))), trees: [], towers: [], crystals: [], rasters: [] };
  const inLand = (x, y, m) => x > 0 && y > 0 && x < W && y < H && sampleArr(s, x, y) < -m;
  // Trees: one candidate per 26px cell; density from the parameter and from large patches (groves and meadows)
  const G = 26;
  for (let cy = 0; cy * G < H; cy++) for (let cx = 0; cx * G < W; cx++) {
    const h = hash2(cx, cy, 11), grove = ss(0.3, 0.62, vnoise(cx * 0.16, cy * 0.16, 5));
    if (h > P.trees * (0.45 + 1.1 * grove)) continue;
    const x = (cx + 0.15 + 0.7 * hash2(cx, cy, 12)) * G, y = (cy + 0.15 + 0.7 * hash2(cx, cy, 13)) * G;
    const r = 7 + 8 * hash2(cx, cy, 14);
    if (!inLand(x, y, r + 6) || nearIcon(x, y, r + 6)) continue;
    const k = hash2(cx, cy, 15);
    geo.trees.push({ x, y, r, kind: k < 0.14 ? 2 : k < 0.42 ? 1 : 0 });   // 0 round, 1 pine, 2 blossom
  }
  geo.trees.sort((a, b) => a.y - b.y);
  // Towers: at most 2, deep inside big islands and well away from the icons
  const cands = [];
  for (let cy = 0; cy * 60 < H; cy++) for (let cx = 0; cx * 60 < W; cx++) {
    const x = (cx + 0.5) * 60, y = (cy + 0.5) * 60;
    if (inLand(x, y, 62) && !nearIcon(x, y, 46)) cands.push({ x, y, h: hash2(cx, cy, 21) });
  }
  cands.sort((a, b) => a.h - b.h);
  for (const c of cands) {
    if (geo.towers.length >= 2) break;
    if (geo.towers.some(t => Math.hypot(t.x - c.x, t.y - c.y) < 420)) continue;
    geo.towers.push(c);
    geo.trees = geo.trees.filter(t => Math.hypot(t.x - c.x, t.y - c.y) > 24 + t.r);
  }
  // Crystals: near the coast, apart from each other
  const cc = [];
  for (let cy = 0; cy * 36 < H; cy++) for (let cx = 0; cx * 36 < W; cx++) {
    const x = (cx + 0.2 + 0.6 * hash2(cx, cy, 31)) * 36, y = (cy + 0.2 + 0.6 * hash2(cx, cy, 32)) * 36;
    const d = x > 0 && y > 0 && x < W && y < H ? sampleArr(s, x, y) : 1;
    if (d < -34 || d > -12 || nearIcon(x, y, 22)) continue;
    cc.push({ x, y, h: hash2(cx, cy, 33), hue: hash2(cx, cy, 34) < 0.55 ? 0 : 1, ph: hash2(cx, cy, 35) * 6.28, sz: 0.8 + 0.5 * hash2(cx, cy, 36) });
  }
  cc.sort((a, b) => a.h - b.h);
  for (const c of cc) {
    if (geo.crystals.length >= P.crystals) break;
    if (geo.crystals.some(o => Math.hypot(o.x - c.x, o.y - c.y) < 140)) continue;
    geo.crystals.push(c);
  }
  geo.trees = geo.trees.filter(t => !geo.crystals.some(c => Math.hypot(t.x - c.x, t.y - c.y) < t.r + 14));
  return geo;
}

/* ======================================================================
   Canvas and cached layers (drawn at the canvas's actual pixels; at most two sizes are kept: the screen and a share/recording size)
   ====================================================================== */
const cv = document.getElementById('art');
const ctx = cv.getContext('2d', { alpha: false });
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h); return c; }
function cached(list, build) {
  const w = cv.width, h = cv.height;
  let hit = list.find(e => e.w === w && e.h === h && e.sky === P.sky);
  if (!hit) { hit = { w, h, sky: P.sky, c: build(w, h, cv._scale) }; list.unshift(hit); if (list.length > 2) list.pop(); }
  return hit.c;
}

const GRASS = rgb('#3f8a55'), GRASS_LIGHT = rgb('#9bd67a'), GRASS_TEAL = rgb('#22706c'), GRASS_DRY = rgb('#b3c060');
const ROCK_TOP = rgb('#7a6250'), ROCK_LOW = rgb('#2b1f3c');

// Large color washes on the grass: a low-resolution image from the field noise, enlarged smoothly
let toneCanvas = null;
function tone() {
  if (toneCanvas) return toneCanvas;
  const c = makeCanvas(Gw, Gh), x = c.getContext('2d'), img = x.createImageData(Gw, Gh);
  for (let i = 0; i < Gw * Gh; i++) {
    const a = NZ.wx[i] + 0.47, b = NZ.wy[i] + 0.47;
    let col = GRASS.map((v, k) => v + (GRASS_LIGHT[k] - v) * ss(0.35, 0.75, a));
    col = col.map((v, k) => v + (GRASS_TEAL[k] - v) * ss(0.5, 0.8, b) * 0.7);
    col = col.map((v, k) => v + (GRASS_DRY[k] - v) * ss(0.62, 0.85, a * 0.6 + (1 - b) * 0.4) * 0.5);
    img.data.set([col[0], col[1], col[2], 255], i * 4);
  }
  x.putImageData(img, 0, 0);
  return (toneCanvas = c);
}
// Fine grass strokes as a pattern drawn at the actual pixels (the pattern matrix undoes the canvas scale so it stays sharp)
function grassPattern(x, s) {
  const S = Math.round(160 * s), c = makeCanvas(S, S), g = c.getContext('2d'), r = mulberry32(seed + 99);
  g.lineCap = 'round';
  for (let i = 0; i < 420; i++) {
    const px = r() * S, py = r() * S, a = -1.2 + r() * 0.5, l = (2 + 3 * r()) * s;
    g.strokeStyle = r() < 0.6 ? 'rgba(25,70,45,0.35)' : 'rgba(200,245,160,0.28)';
    g.lineWidth = Math.max(1, 0.9 * s);
    g.beginPath(); g.moveTo(px, py); g.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); g.stroke();
  }
  const pat = x.createPattern(c, 'repeat');
  pat.setTransform(new DOMMatrix([1 / s, 0, 0, 1 / s, 0, 0]));
  return pat;
}

// Sky far below: dusk gradient, faint nebula and stars between the clouds
const baseCache = [];
function buildBase(cw, ch, s) {
  const c = makeCanvas(cw, ch), x = c.getContext('2d'), sky = SKIES[P.sky];
  x.setTransform(s, 0, 0, s, 0, 0);
  const g = x.createRadialGradient(W * 0.22, H * 0.15, 0, W * 0.45, H * 0.45, Math.max(W, H) * 0.95);
  g.addColorStop(0, sky.glow); g.addColorStop(0.35, sky.mid); g.addColorStop(1, sky.deep);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  if (sky.nebula > 0) {
    x.globalCompositeOperation = 'screen'; x.globalAlpha = sky.nebula; x.imageSmoothingQuality = 'high';
    x.filter = 'hue-rotate(150deg) saturate(1.6)';
    x.drawImage(tone(), 0, 0, W, H);
    x.filter = 'none'; x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1;
  }
  const r = mulberry32(seed + 5);
  for (let i = 0, n = Math.round(W * H / 2600 * sky.stars); i < n; i++) {
    x.fillStyle = `rgba(255,240,255,${0.15 + 0.5 * r() * r()})`;
    x.beginPath(); x.arc(r() * W, r() * H, 0.4 + r() * 0.9, 0, 6.29); x.fill();
  }
  return c;
}

function drawTree(x, t) {
  const r = t.r;

    if (GEOMETRY_KEYS.includes(k)) geometry = true;
    if (k === 'motes') syncMotes();
    if (k === 'sky') redraw = true;                // the cached layers are kept per sky color: nothing to rebuild
    if (k === 'dragon' && val) dragonWait = Math.min(dragonWait, 2);   // just switched on: show it soon
  }
  if (geometry && iconsSeen) rebuildSoon();
  else if (redraw && (paused || !previewMotion) && iconsSeen) draw(performance.now());
}
function drawGhosts() {
  document.getElementById('ghosts').innerHTML = icons.map(ic => `<div class="ghost" style="left:${ic.x}px;top:${ic.y}px;width:${ic.w}px;height:${ic.h}px"><i></i><b></b></div>`).join('');
}
function startHostedMode() {
  if (PREVIEW) document.body.classList.add('ghosts');
  let first = true;
  const settlePaused = () => { if ((paused || !previewMotion) && iconsSeen) { morphT0 = -1e9; draw(performance.now()); } };
  const handle = m => {
    if (m.t === 'previewMotion' && PREVIEW) { previewMotion = !!m.v; settlePaused(); return; }
    if (m.t === 'dragging') { hostDragging = !!m.v; return; }
    if (m.t === 'pause') { paused = PREVIEW ? false : m.v; settlePaused(); return; }
    if (m.t === 'settings') { applySettings(m.v || {}); return; }
    if (m.t === 'reset') { applySettings(Object.assign({}, DEFAULTS, m.v || {})); return; }
    if (m.t !== 'icons') return;
    const k = window.devicePixelRatio || 1;       // physical pixels → CSS pixels
    icons = m.vis ? m.r.map(([l, t, r, b]) => ({ x: l / k, y: t / k, w: (r - l) / k, h: (b - t) / k })) : [];
    if (PREVIEW) drawGhosts();
    iconsSeen = true;
    clearTimeout(rebuildT);
    commit(first);                                // first time: the islands fade in; afterwards: old and new islands cross-fade
    first = false;
  };
  if (PREVIEW) {
    addEventListener('message', ev => { if (ev.source === parent) handle(typeof ev.data === 'string' ? JSON.parse(ev.data) : ev.data); });
    parent.postMessage(JSON.stringify({ t: 'ready' }), '*');
    return;
  }
  const host = window.chrome && window.chrome.webview;
  if (!host) return;
  host.addEventListener('message', ev => handle(JSON.parse(ev.data)));
  host.postMessage('ready');
}
// Opened directly in a browser: a sample desktop (for work on the theme); R = new scene
function startStandalone() {
  document.body.classList.add('ghosts');
  const cell = (c, r) => ({ x: GRID_X0 + c * CELL_W, y: GRID_Y0 + r * CELL_H, w: CELL_W, h: 92 });
  icons = [];
  for (let c = 0; c < 3; c++) for (let r = 0; r < Math.min(8, Math.floor((H - TASKBAR) / CELL_H)); r++) icons.push(cell(c, r));
  for (const [c, r] of [[7, 1], [8, 1], [8, 2], [13, 4], [14, 4], [19, 0], [19, 1]]) if (GRID_X0 + (c + 1) * CELL_W < W) icons.push(cell(c, r));
  drawGhosts();
  iconsSeen = true;
  commit(true);
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reseed((Math.random() * 1e6) | 0); });
}

let resizeT = 0;
addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { resize(); initMovers(); if (iconsSeen) { commit(false); morphT0 = -1e9; } }, 100);
});

resize();
initMovers();
if (WALL || PREVIEW) startHostedMode(); else startStandalone();
requestAnimationFrame(frame);
</script>
