<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DynamicDesktop landscapes</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #173b46; }
  #art, #ghosts { position: fixed; inset: 0; width: 100%; height: 100%; }
  #ghosts { pointer-events: none; }
  .ghost { position: absolute; display: grid; box-sizing: border-box; padding-top: 6px; place-content: start center; justify-items: center; gap: 6px; }
  .ghost i { width: 42px; height: 42px; background: #f7ffffb0; border: 1px solid #fff; border-radius: 9px; }
  .ghost b { width: 48px; height: 5px; background: #f7ffffc0; border-radius: 3px; }
</style>
</head>
<body>
<canvas id="art" aria-label="Adaptive wallpaper"></canvas>
<div id="ghosts"></div>
<script src="environment.js"></script>
<script src="landscape.js"></script>
<script src="community-effects.js"></script>
<script src="share.js"></script>
</body>
</html>
